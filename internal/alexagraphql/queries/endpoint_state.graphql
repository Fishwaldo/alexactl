# GetEndpointState fetches sensor feature data for a batch of endpoint
# IDs. Port of amzconst.QuerySensorState; the same response feeds
# SensorsService.fetchEndpointStates and parseSensorResponse.
#
# The query covers every smart-home property typename plus per-feature
# operations and configuration. The wire
# operationName is "getEndpointState" (matches what upstream Python used
# and what sensors_test.go asserts). The Go-side function is exported
# as GetEndpointState via the shim in exports.go.
query getEndpointState($endpointIds: [String]) {
  listEndpoints(
    listEndpointsInput: {
      latencyTolerance: LOW
      endpointIds: $endpointIds
      includeHouseholdDevices: true
    }
  ) {
    endpoints {
      endpointId: id
      friendlyNameObject { value { text } }
      features {
        name
        instance
        operations { name }
        configuration {
          __typename
          ... on ThermostatConfiguration { supportedModes }
          ... on ModeConfiguration {
            friendlyName { value { text } }
            modeOptions {
              value
              modeResources { friendlyName { value { text } } }
            }
          }
          ... on RangeConfiguration {
            friendlyName { value { text } }
            supportedRange { minimumValue maximumValue precision }
            unitOfMeasure { value { text } }
            presets {
              rangeValue
              presetResources { friendlyName { value { text } } }
            }
          }
        }
        properties {
          name
          type
          accuracy
          error { type message }
          __typename
          ... on Illuminance {
            illuminanceValue { value }
            timeOfSample
            timeOfLastChange
          }
          ... on Reachability {
            reachabilityStatusValue
            timeOfSample
            timeOfLastChange
          }
          ... on DetectionState {
            detectionStateValue
            timeOfSample
            timeOfLastChange
          }
          ... on TemperatureSensor {
            value { value scale }
            timeOfSample
            timeOfLastChange
          }
          ... on RangeValue {
            rangeValue { value }
            timeOfSample
            timeOfLastChange
          }
          ... on Power {
            powerStateValue
            timeOfSample
            timeOfLastChange
          }
          ... on Brightness {
            brightnessStateValue
            timeOfSample
            timeOfLastChange
          }
          ... on Color {
            colorStateValue { hue saturation brightness }
            timeOfSample
            timeOfLastChange
          }
          ... on ColorTemperature {
            colorTemperatureInKelvinStateValue
            timeOfSample
            timeOfLastChange
          }
          ... on Lock {
            lockState
            timeOfSample
            timeOfLastChange
          }
          ... on Setpoint {
            value { value scale }
            deviceNativeScaleValue
            timeOfSample
            timeOfLastChange
          }
          ... on ThermostatMode {
            thermostatModeValue
            timeOfSample
            timeOfLastChange
          }
          ... on Mode {
            modeValue { value }
            timeOfSample
            timeOfLastChange
          }
          ... on ToggleState {
            toggleStateValue
            timeOfSample
            timeOfLastChange
          }
          ... on EnablementState {
            enablementStateValue
            timeOfSample
            timeOfLastChange
          }
          ... on DetectionSensitivity {
            detectionSensitivityValue
            timeOfSample
            timeOfLastChange
          }
          ... on DetectionRange {
            detectionRangeValue
            timeOfSample
            timeOfLastChange
          }
          ... on DetectionTechnology {
            detectionTechnologyValue
            timeOfSample
            timeOfLastChange
          }
        }
      }
    }
  }
}
