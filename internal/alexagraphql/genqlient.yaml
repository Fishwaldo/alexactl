# Configuration for genqlient (https://github.com/Khan/genqlient).
# Edit a .graphql file in queries/ then run `go generate ./internal/alexagraphql/...`.
#
# The schema is the introspected Alexa GraphQL SDL, vendored under schema/.
# (The raw introspection JSON it was derived from is kept out of the repo.)

schema:
  - schema/schema.graphql

operations:
  - queries/*.graphql

generated: generated.go
package: alexagraphql
use_struct_references: true

# Optional-field handling: pointers for nullable fields. The Alexa
# schema returns null for many RETRIEVABLE properties when the device
# is offline or the feature is not present.
optional: pointer

# Custom scalar bindings: map Alexa-schema scalars to Go primitives.
# DateTime is an ISO-8601 timestamp; we keep it as string so callers can
# parse with time.Parse if needed.
bindings:
  DateTime:
    type: string
  Long:
    type: int64
  JSON:
    type: interface{}
  EndpointId:
    type: string
  AddressId:
    type: string
  AmazonFloorPlanLayoutV1:
    type: string
  AmazonFloorPlanLayoutVectorV1:
    type: string
  Asin:
    type: string
