Maps to CAS ConsentActionType, narrowed to the two options
relevant for PSE consent.
"""
enum PseConsentOption {
  ACCEPT
  REJECT
}

"""
Interface for PSE consent query response. Implementations
distinguish between granted and not-yet-granted states.
"""
interface PseConsentResponse {
  """
  Whether PSE consent has been granted.
  DPS backend: derived from consents["PSE_CONSENT"].granted.
