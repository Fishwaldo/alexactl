"""
State property for "action" feature. Additional documentation:
https://wiki.labcollab.net/confluence/display/Doppler/Action+Controller+Alexa+API+Review
"""
type ActionState implements FeatureProperty {
  name: String
  error: ErrorResponse
  accuracy: Accuracy
  type: PropertyType

  """
  The time when the state of the endpoint was sampled. Either through an Alexa.StateReport event,
  or Alexa.ChangeReport event.
  """
  timeOfSample: DateTime

  """
  The time at which the property changed from another value to its current value. For example, if a sensor
  reports a value to Alexa every 30 minutes, timeOfLastChange will only update when the property value
  changes (e.g. from "closed" to "open" or from "locked" to "unlocked"). Note: timeOfLastChange is also updated when a
  property changes type, such as when an error occurs trying to communicate with a device, or an error condition is
  resolved and Alexa obtains a new value for the property.
  """
  timeOfLastChange: DateTime
  actionStateValue: ActionStateValue
}

enum ActionStateEnum {
  START
  STOP
  PAUSE
  RESUME
  UNKNOWN
}

type ActionStateValue {
  """
  The status of the action controller instance that indicates if it is idle, action ongoing or completed etc.
  """
  status: ActionStatus!

  """
  The time when action begins, and the time when the customer expects action to
  complete or the time action completed/stopped.
  """
  timeInterval: TimeInterval

  """
  An identifier 3P defined for the actions reported in discovery response configuration.action.supportedActions.
  It must be the current action if actionState.status is RUNNING or PAUSED or
  the last action if actionState.status is COMPLETED or INCOMPLETE.
  """
  actionId: String

  """
  A list of identifiers 3P defined for the targets reported in discovery response configuration.target.supportedTargets.
  It must be the list of targets of the actionState.actionId.
  """
  targetIds: [String]
}

enum ActionStatus {
  IDLE
  UNAVAILABLE
  RUNNING
  PAUSED
  COMPLETED
  INCOMPLETE
  UNKNOWN
}

