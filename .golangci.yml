version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - bodyclose
    - contextcheck
    - errcheck
    - errorlint
    - gocritic
    - gosec
    - govet
    - ineffassign
    - revive
    - staticcheck
    - unused
  settings:
    gocritic:
      enabled-checks:
        - assignOp
        - commentFormatting
        - paramTypeCombine
    revive:
      rules:
        - name: package-comments
        - name: exported
        - name: unexported-return
        - name: error-strings
        - name: error-naming
        - name: var-naming
    gosec:
      excludes:
        - G104 # audited error returns are intentional in some places
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports
